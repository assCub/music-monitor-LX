# music-monitor —— 多用户榜单/歌单/歌手订阅与 LX 自动下载
#
# 用法：
#   拉现成镜像启动：  docker compose pull && docker compose up -d
#   改代码后本地构建： docker compose up -d --build
#   离线镜像包部署：    docker load -i music-monitor.tar && docker compose up -d
# 国内直连 Docker Hub 常超时，先配镜像加速（见 docs/deploy.md）。
# 启动后访问 http://<NAS-IP>:9090

services:
  platform-auth:
    image: ${PLATFORM_AUTH_IMAGE:-yua0712/music-monitor-lx:platform-auth-v${APP_VERSION:-1.2.2}}
    build:
      context: ./platform-auth
    container_name: music-monitor-platform-auth
    restart: unless-stopped
    expose:
      - "8091"
    environment:
      - PORT=8091

  # LX Music 音源网关：加载 config/lx-sources 中的 .js 音源脚本，并负责取链/降档/落盘。
  lx-gateway:
    image: ${LX_GATEWAY_IMAGE:-yua0712/music-monitor-lx:lx-gateway-v${APP_VERSION:-1.2.2}}
    build:
      context: ./lx-gateway
    container_name: music-monitor-lx-gateway
    restart: unless-stopped
    expose:
      - "8090"
    volumes:
      - ${CONFIG_DIR:-./config}/lx:/config
      - ${CONFIG_DIR:-./config}/lx-sources:/sources
      - ${MUSIC_DIR:-./data/downloads}:/downloads
    environment:
      - PORT=8090
      - LX_SOURCES_DIR=/sources
      - DOWNLOAD_ROOT=/downloads
      - LX_CONFIG_DIR=/config
      - LX_GATEWAY_TOKEN=${LX_GATEWAY_TOKEN:-}
    user: "1000:1000"

  # 监控编排服务（本项目新增）。image 与 build 并存：有镜像直接用，加 --build 才走本地构建。
  monitor:
    image: ${MONITOR_IMAGE:-yua0712/music-monitor-lx:v${APP_VERSION:-1.2.2}}
    build:
      context: ./monitor
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-1.2.2}
        APT_MIRROR: ${APT_MIRROR:-}   # 构建期源加速（国内必开，见 .env.example）
        PIP_INDEX: ${PIP_INDEX:-}
    container_name: music-monitor
    restart: unless-stopped
    ports:
      - "${MONITOR_PORT:-9090}:9090"
    volumes:
      - ${CONFIG_DIR:-./config}/monitor:/app/data  # 监控配置库（SQLite）
      - ${CONFIG_DIR:-./config}/users:/app/users   # 用户独立加密凭据与配置
      - ${MUSIC_DIR:-./data/downloads}:/downloads:ro  # 仅用于判断文件是否仍存在
    environment:
      - TICK_SECONDS=${TICK_SECONDS:-60}
      - DOWNLOAD_CONCURRENCY=${DOWNLOAD_CONCURRENCY:-1}
      - DOWNLOAD_RETRIES=${DOWNLOAD_RETRIES:-2}
      # 分批推送：每批多少首、批与批之间歇多久、单个下载请求超时多久
      - DOWNLOAD_BATCH=${DOWNLOAD_BATCH:-8}
      - DOWNLOAD_BATCH_GAP=${DOWNLOAD_BATCH_GAP:-3}
      - DOWNLOAD_TIMEOUT=${DOWNLOAD_TIMEOUT:-300}
      # 0 = 不限，由每个监控自己的「单次最多下载」说了算
      - MAX_DOWNLOADS_PER_RUN=${MAX_DOWNLOADS_PER_RUN:-0}
      - DEFAULT_QUALITY=${DEFAULT_QUALITY:-master}
      - LX_GATEWAY_URL=http://lx-gateway:8090
      - PLATFORM_AUTH_URL=http://platform-auth:8091
      - LX_GATEWAY_TOKEN=${LX_GATEWAY_TOKEN:-}
      - LX_PLATFORM_PRIORITY=${LX_PLATFORM_PRIORITY:-tx,kg,kw,mg,wy}
      - LX_QUALITY_FLOOR=${LX_QUALITY_FLOOR:-128k}
      - LX_SEARCH_LIMIT=${LX_SEARCH_LIMIT:-30}
      - LX_MATCH_THRESHOLD=${LX_MATCH_THRESHOLD:-0.76}
      - USERS_CONFIG_DIR=/app/users
      - CREDENTIALS_MASTER_KEY=${CREDENTIALS_MASTER_KEY:-}
      - TZ=${TZ:-Asia/Shanghai}
    depends_on:
      - lx-gateway
      - platform-auth
    user: "1000:1000"
